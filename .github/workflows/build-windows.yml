name: Build JR Printer (Windows)
on:
  workflow_dispatch:
  push:
    paths: ["print-conductor/jr-printer/**"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print-conductor/jr-printer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt pyinstaller
      - name: "Testes (os testes de impressão simulada são pulados no Windows)"
        run: python -m unittest discover -s tests
      - name: Empacotar
        run: |
          python -m PyInstaller --noconfirm --onefile --noconsole --name JRPrinter --icon jrprinter/assets/icon.ico --add-data "jrprinter/assets;jrprinter/assets" --collect-all tkinterdnd2 --collect-all pypdfium2 --hidden-import win32com.client --hidden-import pythoncom jr_printer.py
      - uses: actions/upload-artifact@v4
        with:
          name: JRPrinter-windows
          path: print-conductor/jr-printer/dist/JRPrinter.exe
