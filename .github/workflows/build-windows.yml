name: Build PrintBatch (Windows)
on:
  workflow_dispatch:
  push:
    paths: ["batch_print/**"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: batch_print
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests
      - name: Empacotar
        run: |
          python -m pip install pyinstaller pywin32 tkinterdnd2 pypdfium2 pillow
          python -m PyInstaller --noconfirm --onefile --noconsole --name PrintBatch --collect-all tkinterdnd2 --collect-all pypdfium2 --hidden-import win32com.client --hidden-import pythoncom batch_print.py
      - uses: actions/upload-artifact@v4
        with:
          name: PrintBatch-windows
          path: batch_print/dist/PrintBatch.exe
